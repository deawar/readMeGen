<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; font-src 'self'; base-uri 'none'; object-src 'none'">
  <title>ReadMeGen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; }

    /* ── Toolbar ── */
    #toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: #181825; border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }
    #toolbar button, #toolbar select {
      background: #313244; color: #cdd6f4; border: 1px solid #45475a;
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #45475a; }
    #toolbar .sep { width: 1px; height: 24px; background: #45475a; margin: 0 4px; }
    #toolbar label { font-size: 12px; color: #a6adc8; }

    /* ── Tabs ── */
    #tabs {
      display: flex; gap: 0; background: #181825; padding: 0 12px;
      border-bottom: 1px solid #313244; flex-shrink: 0;
    }
    #tabs button {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: #a6adc8; padding: 8px 16px; cursor: pointer; font-size: 13px;
      transition: color 0.15s;
    }
    #tabs button.active { color: #89b4fa; border-bottom-color: #89b4fa; }
    #tabs button:hover { color: #cdd6f4; }

    /* ── Main area ── */
    #main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Status bar ── */
    #status {
      padding: 4px 12px; background: #181825; font-size: 11px; color: #a6adc8;
      border-top: 1px solid #313244; flex-shrink: 0; min-height: 22px;
    }
    #status.error { color: #f38ba8; }
    #status.ok { color: #a6e3a1; }

    /* ── Edit canvas ── */
    #canvas {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    #canvas.dragover { outline: 2px dashed #89b4fa; outline-offset: -4px; }

    .block-card {
      background: #313244; border: 1px solid #45475a; border-radius: 6px;
      display: flex; flex-direction: column;
    }
    .block-card.drag-over { border-color: #89b4fa; }

    .block-header {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-bottom: 1px solid #45475a; background: #1e1e2e;
      border-radius: 6px 6px 0 0;
    }
    .drag-handle {
      cursor: grab; color: #585b70; font-size: 16px; user-select: none; padding: 2px 4px;
    }
    .drag-handle:active { cursor: grabbing; }
    .block-type-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 10px;
      background: #45475a; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .block-heading { flex: 1; font-size: 12px; color: #89b4fa; font-weight: 600; }
    .btn-delete {
      background: none; border: none; color: #f38ba8; cursor: pointer;
      font-size: 14px; padding: 2px 6px; border-radius: 3px;
    }
    .btn-delete:hover { background: #45475a; }

    .block-body { padding: 10px 12px; }

    .block-rendered { line-height: 1.6; font-size: 14px; cursor: pointer; min-height: 24px; }
    .block-rendered:hover { background: rgba(137,180,250,0.05); border-radius: 3px; }
    .block-rendered p { margin-bottom: 8px; }
    .block-rendered h1, .block-rendered h2, .block-rendered h3 { margin-bottom: 8px; }
    .block-rendered pre { background: #1e1e2e; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
    .block-rendered code { background: #1e1e2e; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    .block-rendered a { color: #89b4fa; }
    .block-rendered img { max-width: 100%; }
    .block-rendered ul, .block-rendered ol { padding-left: 20px; margin-bottom: 8px; }

    .block-editor textarea {
      width: 100%; min-height: 120px; background: #1e1e2e; color: #cdd6f4;
      border: 1px solid #45475a; border-radius: 4px; padding: 8px; font-family: monospace;
      font-size: 13px; resize: vertical; line-height: 1.5;
    }
    .block-editor textarea:focus { outline: none; border-color: #89b4fa; }
    .edit-hint { font-size: 10px; color: #585b70; margin-top: 4px; }

    /* ── Header form ── */
    .header-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .header-form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #a6adc8; }
    .header-form input {
      background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a;
      border-radius: 4px; padding: 5px 8px; font-size: 13px;
    }
    .header-form input:focus { outline: none; border-color: #89b4fa; }
    .header-form .full-width { grid-column: 1 / -1; }
    .btn-save-header {
      grid-column: 1 / -1; background: #89b4fa; color: #1e1e2e;
      border: none; border-radius: 4px; padding: 6px 16px; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    .btn-save-header:hover { background: #74c7ec; }

    /* ── Add section ── */
    #add-section {
      background: none; border: 2px dashed #45475a; color: #585b70;
      border-radius: 6px; padding: 10px; cursor: pointer; font-size: 13px;
      width: 100%; transition: all 0.15s;
    }
    #add-section:hover { border-color: #89b4fa; color: #89b4fa; }

    /* ── Preview pane ── */
    #preview-pane {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      background: #ffffff; color: #1e1e2e; display: none; font-size: 15px; line-height: 1.7;
    }
    #preview-pane h1 { font-size: 2em; margin-bottom: 12px; }
    #preview-pane h2 { font-size: 1.5em; margin-top: 24px; margin-bottom: 8px; }
    #preview-pane h3 { font-size: 1.2em; margin-top: 16px; margin-bottom: 6px; }
    #preview-pane p { margin-bottom: 12px; }
    #preview-pane pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; }
    #preview-pane code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 13px; }
    #preview-pane a { color: #0969da; }
    #preview-pane img { max-width: 100%; }
    #preview-pane ul, #preview-pane ol { padding-left: 24px; margin-bottom: 12px; }
    #preview-pane table { border-collapse: collapse; margin-bottom: 12px; }
    #preview-pane th, #preview-pane td { border: 1px solid #ccc; padding: 6px 12px; }

    /* ── Markdown pane ── */
    #markdown-pane {
      flex: 1; overflow-y: auto; padding: 16px; display: none; background: #1e1e2e;
    }
    #markdown-pane pre {
      font-family: monospace; font-size: 13px; color: #cdd6f4; white-space: pre-wrap;
      word-break: break-word; line-height: 1.6;
    }

    /* ── Drop overlay hint ── */
    #drop-hint {
      pointer-events: none; position: fixed; inset: 0;
      background: rgba(137,180,250,0.12); border: 3px dashed #89b4fa;
      display: none; align-items: center; justify-content: center;
      font-size: 20px; color: #89b4fa; z-index: 100;
    }
    #drop-hint.visible { display: flex; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-new">New</button>
    <button id="btn-open">Open</button>
    <button id="btn-save">Save</button>
    <div class="sep"></div>
    <button id="btn-author">Fill Author</button>
    <label>
      License:
      <select id="license-select">
        <option value="">— select —</option>
        <option value="MIT">MIT</option>
        <option value="Apache 2.0">Apache 2.0</option>
        <option value="GNU AGPLv3">GNU AGPLv3</option>
        <option value="GNU GPLv3">GNU GPLv3</option>
        <option value="GPLv3">GPLv3</option>
        <option value="Mozilla Public License 2.0">Mozilla Public License 2.0</option>
        <option value="The Unlicense">The Unlicense</option>
      </select>
    </label>
  </div>

  <div id="tabs">
    <button id="tab-edit" class="active">Edit</button>
    <button id="tab-preview">Preview</button>
    <button id="tab-markdown">Markdown</button>
  </div>

  <div id="main">
    <div id="canvas"></div>
    <div id="preview-pane"></div>
    <div id="markdown-pane"><pre id="markdown-pre"></pre></div>
  </div>

  <div id="status"></div>
  <div id="drop-hint">Drop a manifest file (package.json, requirements.txt…)</div>

  <script type="module" src="src/gui/renderer.js"></script>
</body>
</html>
