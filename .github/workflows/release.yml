name: Release

# Build the Electron app on all three desktop OSes and publish the installers
# to a DRAFT GitHub Release. Trigger by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# The release is created as a draft — review the attached binaries, then click
# Publish on the Releases page. workflow_dispatch lets you dry-run a build
# (artifacts are built but not published) without tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and publish
        env:
          # electron-builder reads GH_TOKEN to create/update the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: do not attempt macOS code signing on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Publish only when building from a version tag; manual runs just build.
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
